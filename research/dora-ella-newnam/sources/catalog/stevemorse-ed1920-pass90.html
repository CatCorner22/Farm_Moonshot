<html>  <head><meta charset="utf-8">    <title>      Oops    </title>    <script src="https://stevemorse.org/email.js"></script>    <script>      function Redirect() {        var url = String(document.location);        var len = url.length;        var percent = url.charAt(len-3);        if (percent == '%') { // last three chars are %xx          // if last three chars are %xx, it probably doesn't belong          // Get rid of it and try fetching url without it.          url = url.substring(0, len-3);        } else {          // If last character in url is a punctuation, it probably doesn't belong          // Get rid of it and try fetching url without it.          var ch = url.charAt(len-1);          if (ch >= 'A' && ch <= 'Z') return; // upper case alpha          if (ch >= 'a' && ch <= 'z') return; // lower case alpha          if (ch >= '0' && ch <= '9') return; // number          // last character is not alphanumeric, so get rid of it          url = url.substring(0, len-1);        }        document.location.replace(url);      }      function GetParameter(parameter) {        // convert query string to array of individual arguments        var query = GetQueryString();        var arglist = query.split("&");        // process each argument        for (var j in arglist) {          var equalSign = arglist[j].indexOf("=");          var leftSide = (equalSign == -1) ? arglist[j] : arglist[j].substr(0, equalSign);          if (leftSide == parameter) {            var rightSide = (equalSign == -1) ? "" : arglist[j].substr(equalSign+1);            return unescape(rightSide);          }        }        return "";      }      function GetQueryString() {        var url = document.location.toString();        var questionmarkPosition = url.indexOf("?");        return (questionmarkPosition == -1) ? "" : url.substr(questionmarkPosition+1);      }    </script>        </head>  <body onload="Redirect();">    <center><font size=+3>Oops!!</font></center>    <br>    <br>    <blockquote><blockquote>      The page you requested,&nbsp;      <font color="red">        <script>          var url = GetParameter("request");          var ref = document.referrer;          document.write("https://stevemorse.org" + url);        </script>      </font>,      is not on my server.      <br>      If you don't understand why you got this error message, click      <script>        document.write('<a href="' + emailurl + '?subject=Oops:%20');        document.write(url);        document.write('[');        document.write(ref);        // note ref no longer contains full path, only protocol and domain        // this is due to remote site's referrer policy        document.write(']">here</a>');      </script>      to send me e-mail and tell me what you were looking for.  Thanks.      <br><br>      Click <a href="https://stevemorse.org/index.html">here</a> to see a list of all my pages.      <br><br>      -- Steve Morse    </blockquote></blockquote>  </body></html>
