    <script data-ref="ignore">
        window.__INITIAL_STATE__ = JSON.parse("{\"intl\":{\"locale\":\"en_US\",\"messages\":{\"SITE_CONFIG_aboutPageHtml\":\"\u0026amp;lt;h2 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt;Check out our Frequently Asked Questions (FAQ\u0026amp;apos;s) and Tips below!\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/h2\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; What is the Arkansas Digital Archives and who manages the content? \u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;The Arkansas Digital Archives provides online access to digitized materials maintained by the Arkansas State Archives. The site is produced by Archives staff on the CONTENTdm platform, powered by OCLC.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Click\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.arkansasheritage.com\/arkansas-state-archives-about\/history-and-mission\u0026amp;quot;\u0026amp;gt;here\u0026amp;lt;\/a\u0026amp;gt;\u00A0to learn more about the history of the Arkansas State Archives.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; How do I find things on the Arkansas Digital Archives website?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;There are multiple ways to search Arkansas Digital Archives site. The easiest way is to either use the Collection Cards on the \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/ar-digital.contentdm.oclc.org\/digital\/\u0026amp;quot;\u0026amp;gt;Home Page\u0026amp;lt;\/a\u0026amp;gt; or selecting the Browse button on the navigation menu. The Collection Cards are by type of materials such as Manuscript Collections, Image Collections (photographs and drawings), Map Collection, etc.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;By selecting the Browse button, you can scroll, or browse, through all the items we\u0026amp;apos;ve uploaded to the site. By using the filters on the left side, you can narrow your search by Collections, Relations, Subjects, Coverage, Dates, and Format-Medium. The terms listed below each group are called \u0026amp;quot;subject terms,\u0026amp;quot; also known as \u0026amp;quot;subjects\u0026amp;quot; or \u0026amp;quot;keywords,\u0026amp;quot; which can help you narrow your search.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;You can use the search bar located at the top right of the navigation menu to type in subject terms such as Civil War, Crawford County, probate records, photographs, etc. Do not type in a question as the site does not recognize questions, only subject terms.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;You can also use the Advanced Search option. This will allow you to choose which collection you want to search in, include one or multiple search terms, and enter in any dates.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Be sure to check out our \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/ar-digital.contentdm.oclc.org\/digital\/collection\/guides\/search\u0026amp;quot;\u0026amp;gt;Resource Guides\u0026amp;lt;\/a\u0026amp;gt; for upcoming search guides!\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; I can\u2019t find my subject on this site. Does that mean the Arkansas Digital Archives doesn\u2019t have any material on my subject?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;If the tips suggested above don\u2019t yield results, you may call us at 501.682.6900 or email us at state.archives\u0026#64;arkansas.gov.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Please note that not all of our collections are available online.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; Do you plan to digitize all of your records?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Due to the size of our collections, staffing, and funding concerns, we do not plan to digitize the entirety of our collections at this time. However, we do plan to make available increasing numbers of finding aids -- located on our \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/findingaids.digitalheritage.arkansas.gov\/\u0026amp;quot;\u0026amp;gt;Finding Aids and Records\u0026amp;lt;\/a\u0026amp;gt; site, digital scans, and other information regarding our collections.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Onsite microfilm viewing is expected to remain the primary means of access for many county records and any newspapers not yet on\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/centralarkansaslibrarysystem.newspapers.com\/welcome\/#silo\u0026#61;176\u0026amp;quot;\u0026amp;gt;newspapers.com\u0026amp;lt;\/a\u0026amp;gt;\u00A0and the Library of Congress\u2019s\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/chroniclingamerica.loc.gov\/\u0026amp;quot;\u0026amp;gt;Chronicling America\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; How can I learn when new content is added?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Stay tuned to our\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.facebook.com\/ArkansasStateArchives\/\u0026amp;quot;\u0026amp;gt;Facebook\u0026amp;lt;\/a\u0026amp;gt;\u00A0and\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/twitter.com\/ArArkives\u0026amp;quot;\u0026amp;gt;Twitter\u0026amp;lt;\/a\u0026amp;gt;\u00A0social media platforms for important announcements.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; Why is this download taking a long time?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;The Arkansas Digital Archives strives to make quality and readable scans available online. Please be patient when downloading these files, as items can take significant time to download.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Many larger scrapbooks have been tested at different qualities and are at their peak compromise between quality and download speed. They are currently packaged as a single download to make viewing more convenient to you.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;If after several attempts you are unable to download a particular file, feel free to contact us for smaller sections. Alternately, you may also visit our research room and use our internet to download the files you want. Our research room has several computers available for patron use and freely available wireless internet.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; Can I order higher resolution copies of an item I found on the Arkansas Digital Archives?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Yes! The copies available online are of access quality, and in most cases, are not the highest possible resolution. If you need higher resolution for publication, please complete and submit a\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.arkansasheritage.com\/docs\/default-source\/arkansas-state-archives-documents\/dah-asa-mediareproductionorderform.pdf?sfvrsn\u0026#61;8d5c823_0\u0026amp;quot;\u0026amp;gt;Media Reproduction Order Form\u0026amp;lt;\/a\u0026amp;gt;, available on our\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.arkansasheritage.com\/arkansas-state-archives\/collections-and-research\/research-services\u0026amp;quot;\u0026amp;gt;Research Services\u0026amp;lt;\/a\u0026amp;gt;\u00A0page.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; How do I cite items I found on this site?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Each item\u2019s information page includes a recommended citation. Please use that citation when referencing content from the Arkansas Digital Archives.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; What do I need to do to publish an item I found on this site?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;Please help us show the value of our materials in our usage reports. Submit a\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.arkansasheritage.com\/docs\/default-source\/arkansas-state-archives-documents\/dah-asa-permissionform.pdf?sfvrsn\u0026#61;66507c3b_0\u0026amp;quot;\u0026amp;gt;Publication Permission form\u0026amp;lt;\/a\u0026amp;gt;\u00A0for any items you plan to highlight in research, academic lectures, student project or paper, film\/video, electronic media, print media, or other project. There is no permission fee required. You may email us at state.archives\u0026#64;arkansas.gov.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; Can I contribute to this site?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;The Arkansas State Archives welcomes donations from individuals, families, and organizations, as well as transfer of records having long-term value from others state agencies, offices, and commissions. If you have material that you think might be of interest to the Arkansas State Archives and for the Arkansas Digital Archives site, we would like to hear from you. Please check out\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.arkansasheritage.com\/arkansas-state-archives\/support-us\/donate-materials\u0026amp;quot;\u0026amp;gt;Donating Materials,\u0026amp;lt;\/a\u0026amp;gt;\u00A0then complete and submit the form, and a representative from the archives will contact you shortly. Thank you for helping to preserve the rich and wonderful history of Arkansas and its people!\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;h3 class\u0026#61;\u0026amp;quot;cdm_style\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;details\u0026amp;gt;\u0026amp;lt;summary\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt; How can I help?\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/summary\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;padding-left: 30px;\u0026amp;quot;\u0026amp;gt;There are many opportunities to intern and volunteer at the Arkansas State Archives. To learn more about the areas of work visit\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.arkansasheritage.com\/arkansas-state-archives\/support-us\/become-a-volunteer\u0026amp;quot;\u0026amp;gt;Become a Volunteer\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/details\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\",\"SITE_CONFIG_aboutPageTitle\":\"FAQ\",\"SITE_CONFIG_breadcrumbTopLevelText\":\"Home\",\"SITE_CONFIG_customHomePageAltText\":\"\",\"SITE_CONFIG_downloadExtraLargeEnabled\":\"Extra Large\",\"SITE_CONFIG_downloadFullResEnabled\":\"Full-size archival image\",\"SITE_CONFIG_downloadFullSizeEnabled\":\"Full-size\",\"SITE_CONFIG_downloadLargeEnabled\":\"Large\",\"SITE_CONFIG_downloadMediumEnabled\":\"Medium\",\"SITE_CONFIG_downloadSmallEnabled\":\"Small\",\"SITE_CONFIG_globalHomePageHtml\":\"\u0026amp;lt;h1\u0026amp;gt;\u0026amp;lt;span style\u0026#61;\u0026amp;quot;font-size: medium;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt;Welcome! \u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/h1\u0026amp;gt;\\n\u0026amp;lt;h1\u0026amp;gt;\u0026amp;lt;span style\u0026#61;\u0026amp;quot;font-size: medium;\u0026amp;quot;\u0026amp;gt;The Arkansas Digital Archives contains thousands of images of a wide variety of records preserved by the Arkansas State Archives. We invite you to view items from the ASA\u2019s extensive holdings of original documents, government records, photographs, maps, and much, much more!\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/h1\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;text-align: center;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;em\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt;\u0026amp;lt;span style\u0026#61;\u0026amp;quot;font-size: medium;\u0026amp;quot;\u0026amp;gt;All FIVE (5) of our State Constitutions are available online and transcribed! \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/ar-digital.contentdm.oclc.org\/digital\/search\/searchterm\/arkansas%20state%20constitution%20(ms.000540)!constitution\/field\/relati!all\/mode\/exact!all\/conn\/and!all\/order\/title\/ad\/asc\u0026amp;quot;\u0026amp;gt;Check them out!\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/em\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h1\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt;Search Our Catalogs:\u0026amp;lt;\/strong\u0026amp;gt;\u0026amp;lt;\/h1\u0026amp;gt;\\n\u0026amp;lt;h2\u0026amp;gt;\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/findingaids.digitalheritage.arkansas.gov\/\u0026amp;quot;\u0026amp;gt;Collection\u00A0Finding Aids\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/h2\u0026amp;gt;\\n\u0026amp;lt;h2\u0026amp;gt;\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/arks.ent.sirsi.net\/client\/en_US\/archives\/\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Library Catalog\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/h2\u0026amp;gt;\\n\u0026amp;lt;h2\u0026amp;gt;\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/findingaids.digitalheritage.arkansas.gov\/repositories\/3\/classifications\/5\u0026amp;quot;\u0026amp;gt;Microfilm Collections\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/h2\u0026amp;gt;\\n\u0026amp;lt;h2\u0026amp;gt;\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/findingaids.digitalheritage.arkansas.gov\/repositories\/3\/classification_terms\/522\u0026amp;quot;\u0026amp;gt;Newspaper Collections\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/h2\u0026amp;gt;\\n\u0026amp;lt;h1\u0026amp;gt;Check u
